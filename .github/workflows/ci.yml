name: Python CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python files
        run: python -m compileall api model data dashboard

      - name: Run tests
        run: pytest -q

      - name: Static syntax and undefined-name check
        run: |
          pip install flake8
          flake8 api model data dashboard tests --count --select=E9,F63,F7,F82 --show-source --statistics
